name: Release

# Builds the package and publishes it to PyPI when a version tag is pushed,
# e.g. `git tag v5.9.2 && git push origin v5.9.2`.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token/secret is
# stored in the repository. Before the first release, configure a trusted
# publisher on PyPI:
#   PyPI -> project `seedkeeper-manager` -> Publishing -> Add a pending publisher
#     Owner:            Toporin
#     Repository name:  seedkeeper-manager
#     Workflow name:    release.yml
#     Environment name: pypi

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq swig libpcsclite-dev

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject version '$version'"
            exit 1
          fi

      - name: Build package
        run: |
          # poetry sets all timestamps to 0 by default, which Debian doesn't allow
          export SOURCE_DATE_EPOCH=$(git show --no-patch --format=%ct)
          uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/seedkeeper-manager

    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
